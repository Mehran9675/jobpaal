name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          # Extension manifests only accept 1-4 dot-separated integers.
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build and package
        env:
          JOBPAAL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run build
          npm run zip
          # Firefox installs add-ons from .xpi files (same zip format).
          cp "jobpaal-firefox-$JOBPAAL_VERSION.zip" "jobpaal-firefox-$JOBPAAL_VERSION.xpi"
          ls -l jobpaal-*

      - uses: actions/upload-artifact@v4
        with:
          name: jobpaal-${{ steps.version.outputs.version }}
          path: |
            jobpaal-*.zip
            jobpaal-*.xpi

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" jobpaal-*.zip jobpaal-*.xpi --clobber
